<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水回りの仕組み — 図解</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f0f4f8; color: #2d3748; padding: 32px; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 8px; color: #1a365d; }
  .subtitle { text-align: center; font-size: 0.9rem; color: #718096; margin-bottom: 32px; }

  .diagram-section { max-width: 900px; margin: 0 auto 48px; }
  .diagram-section h2 { font-size: 1.2rem; color: #2b6cb0; margin-bottom: 16px; border-left: 4px solid #3182ce; padding-left: 12px; }

  svg { display: block; margin: 0 auto; }

  .note-box {
    background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px;
    padding: 16px 20px; margin: 24px auto; max-width: 900px;
    font-size: 0.88rem; line-height: 1.8; color: #2a4365;
  }
  .note-box strong { color: #2b6cb0; }

  .legend {
    display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    margin: 16px 0 32px; font-size: 0.82rem;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 24px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>

<h1>水回りの仕組み — 図解</h1>
<p class="subtitle">川の流れ（重力）と水魔法の浄化を組み合わせた循環構造</p>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#3182ce;"></div>きれいな水</div>
  <div class="legend-item"><div class="legend-color" style="background:#e53e3e;"></div>汚水・排水</div>
  <div class="legend-item"><div class="legend-color" style="background:#38a169;"></div>浄化済みの水</div>
  <div class="legend-item"><div class="legend-color" style="background:#d69e2e;"></div>汚泥（肥料）</div>
  <div class="legend-item"><div class="legend-color" style="background:#805ad5;"></div>浄化の術式石</div>
</div>

<!-- ==================== 村の図 ==================== -->
<div class="diagram-section">
<h2>村の水回り（50〜100人規模）</h2>

<svg viewBox="0 0 860 520" width="860" height="520">
  <!-- 背景 -->
  <rect width="860" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 川（上から下へ斜めに流れる） -->
  <path d="M 80 40 Q 60 130, 80 200 Q 100 280, 70 360 Q 50 430, 80 500"
        stroke="#90cdf4" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M 80 40 Q 60 130, 80 200 Q 100 280, 70 360 Q 50 430, 80 500"
        stroke="#4299e1" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="30" y="30" font-size="13" fill="#2b6cb0" font-weight="bold">川上</text>
  <text x="30" y="498" font-size="13" fill="#2b6cb0" font-weight="bold">川下</text>
  <text x="56" y="260" font-size="11" fill="#4299e1" transform="rotate(-80,56,260)">← 川の流れ →</text>

  <!-- 取水（川上から支流を引く） -->
  <line x1="95" y1="100" x2="220" y2="100" stroke="#3182ce" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="215,95 225,100 215,105" fill="#3182ce"/>
  <text x="130" y="90" font-size="11" fill="#3182ce">支流を引く</text>

  <!-- 土守の開閉ポイント -->
  <rect x="110" y="105" width="80" height="28" rx="4" fill="#fffff0" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="150" y="123" font-size="9.5" fill="#975a16" text-anchor="middle" font-weight="bold">土守が開閉</text>

  <!-- 浄化① -->
  <rect x="220" y="75" width="110" height="50" rx="25" fill="#f0e6ff" stroke="#805ad5" stroke-width="2"/>
  <text x="275" y="105" font-size="13" fill="#805ad5" text-anchor="middle" font-weight="bold">浄化の術式石 ①</text>
  <text x="275" y="140" font-size="10" fill="#718096" text-anchor="middle">不純物を分離</text>

  <!-- 矢印：浄化→飲み水池 -->
  <line x1="330" y1="100" x2="410" y2="100" stroke="#38a169" stroke-width="3"/>
  <polygon points="405,95 415,100 405,105" fill="#38a169"/>

  <!-- 飲み水用ため池 -->
  <rect x="410" y="60" width="180" height="80" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <text x="500" y="92" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">飲み水用ため池</text>
  <text x="500" y="110" font-size="11" fill="#718096" text-anchor="middle">（高い位置）</text>

  <!-- 高さを示す地形線 -->
  <text x="610" y="88" font-size="10" fill="#a0aec0">▲ 高台</text>

  <!-- 矢印：飲み水池→集落 -->
  <line x1="500" y1="140" x2="500" y2="210" stroke="#3182ce" stroke-width="3"/>
  <polygon points="495,205 500,215 505,205" fill="#3182ce"/>
  <text x="515" y="180" font-size="11" fill="#3182ce">重力で配水</text>

  <!-- 集落 -->
  <rect x="350" y="215" width="300" height="100" rx="10" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="500" y="250" font-size="15" fill="#975a16" text-anchor="middle" font-weight="bold">集 落</text>
  <text x="500" y="272" font-size="11" fill="#975a16" text-anchor="middle">住居・浴場・畑</text>
  <text x="500" y="290" font-size="11" fill="#975a16" text-anchor="middle">（暗渠で配水・排水）</text>

  <!-- 矢印：集落→下水池 -->
  <line x1="500" y1="315" x2="500" y2="370" stroke="#e53e3e" stroke-width="3"/>
  <polygon points="495,365 500,375 505,365" fill="#e53e3e"/>
  <text x="515" y="350" font-size="11" fill="#e53e3e">排水（重力）</text>

  <!-- 下水用ため池 -->
  <rect x="410" y="375" width="180" height="80" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="500" y="407" font-size="14" fill="#c53030" text-anchor="middle" font-weight="bold">下水用ため池</text>
  <text x="500" y="425" font-size="11" fill="#718096" text-anchor="middle">（低い位置）</text>

  <!-- 低い位置の表示 -->
  <text x="610" y="412" font-size="10" fill="#a0aec0">▼ 低地</text>

  <!-- 矢印：下水池→浄化② -->
  <line x1="410" y1="415" x2="330" y2="415" stroke="#e53e3e" stroke-width="3"/>
  <polygon points="335,410 325,415 335,420" fill="#e53e3e"/>

  <!-- 浄化② -->
  <rect x="220" y="390" width="110" height="50" rx="25" fill="#f0e6ff" stroke="#805ad5" stroke-width="2"/>
  <text x="275" y="420" font-size="13" fill="#805ad5" text-anchor="middle" font-weight="bold">浄化の術式石 ②</text>

  <!-- 矢印：浄化②→川下 -->
  <line x1="220" y1="415" x2="100" y2="415" stroke="#38a169" stroke-width="3"/>
  <polygon points="105,410 95,415 105,420" fill="#38a169"/>
  <text x="155" y="405" font-size="11" fill="#38a169">浄化して川に返す</text>

  <!-- 汚泥→畑 -->
  <line x1="500" y1="455" x2="500" y2="485" stroke="#d69e2e" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="495,480 500,490 505,480" fill="#d69e2e"/>
  <text x="500" y="507" font-size="11" fill="#d69e2e" text-anchor="middle">汚泥 → 畑の肥料</text>

  <!-- 水守の表示 -->
  <g transform="translate(700, 160)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
    <text x="70" y="22" font-size="12" fill="#276749" text-anchor="middle" font-weight="bold">水守の日課</text>
    <text x="10" y="42" font-size="10.5" fill="#2d3748">朝：術式石①を起動</text>
    <text x="10" y="58" font-size="10.5" fill="#2d3748">夕：術式石②を起動</text>
    <text x="10" y="74" font-size="10.5" fill="#2d3748">汚泥を畑に運ぶ</text>
    <text x="10" y="90" font-size="10.5" fill="#718096">※水守不在時は平民</text>
    <text x="10" y="104" font-size="10.5" fill="#718096">　数人がかりで代行可</text>
  </g>

</svg>
</div>

<!-- ==================== 王都の図 ==================== -->
<div class="diagram-section">
<h2>王都の水回り（大規模・複数区画）</h2>

<svg viewBox="0 0 860 440" width="860" height="440">
  <rect width="860" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 河川 -->
  <path d="M 60 30 L 60 410" stroke="#90cdf4" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M 60 30 L 60 410" stroke="#4299e1" stroke-width="4" fill="none"/>
  <text x="22" y="24" font-size="12" fill="#2b6cb0" font-weight="bold">川上</text>
  <text x="22" y="430" font-size="12" fill="#2b6cb0" font-weight="bold">川下</text>

  <!-- 取水 -->
  <line x1="76" y1="70" x2="170" y2="70" stroke="#3182ce" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="166,66 174,70 166,74" fill="#3182ce"/>

  <!-- 浄化① -->
  <rect x="170" y="50" width="90" height="40" rx="20" fill="#f0e6ff" stroke="#805ad5" stroke-width="2"/>
  <text x="215" y="75" font-size="11" fill="#805ad5" text-anchor="middle" font-weight="bold">浄化 ①</text>

  <!-- 大型貯水池 -->
  <line x1="260" y1="70" x2="310" y2="70" stroke="#38a169" stroke-width="2.5"/>
  <polygon points="306,66 314,70 306,74" fill="#38a169"/>
  <rect x="310" y="40" width="160" height="60" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <text x="390" y="65" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">大型貯水池</text>
  <text x="390" y="82" font-size="10" fill="#718096" text-anchor="middle">（王都の高台）</text>

  <!-- 配水網 -->
  <line x1="390" y1="100" x2="390" y2="140" stroke="#3182ce" stroke-width="2.5"/>
  <text x="405" y="125" font-size="10" fill="#3182ce">配水網（地下暗渠）</text>

  <!-- 区画群 -->
  <!-- 区画A -->
  <rect x="140" y="145" width="150" height="70" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="215" y="175" font-size="12" fill="#975a16" text-anchor="middle" font-weight="bold">区画A</text>
  <text x="215" y="193" font-size="10" fill="#975a16" text-anchor="middle">住居・商業</text>

  <!-- 区画B -->
  <rect x="310" y="145" width="150" height="70" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="385" y="175" font-size="12" fill="#975a16" text-anchor="middle" font-weight="bold">区画B</text>
  <text x="385" y="193" font-size="10" fill="#975a16" text-anchor="middle">王宮・公共</text>

  <!-- 区画C -->
  <rect x="480" y="145" width="150" height="70" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="555" y="175" font-size="12" fill="#975a16" text-anchor="middle" font-weight="bold">区画C</text>
  <text x="555" y="193" font-size="10" fill="#975a16" text-anchor="middle">浴場・市場</text>

  <!-- 配水の矢印 -->
  <line x1="350" y1="100" x2="215" y2="145" stroke="#3182ce" stroke-width="1.5"/>
  <line x1="390" y1="100" x2="385" y2="145" stroke="#3182ce" stroke-width="1.5"/>
  <line x1="430" y1="100" x2="555" y2="145" stroke="#3182ce" stroke-width="1.5"/>

  <!-- 排水の矢印 -->
  <line x1="215" y1="215" x2="215" y2="275" stroke="#e53e3e" stroke-width="1.5"/>
  <line x1="385" y1="215" x2="385" y2="275" stroke="#e53e3e" stroke-width="1.5"/>
  <line x1="555" y1="215" x2="555" y2="275" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="300" y="252" font-size="10" fill="#e53e3e">排水（重力で下へ）</text>

  <!-- 区画別下水池 -->
  <rect x="150" y="275" width="120" height="50" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="210" y="305" font-size="10" fill="#c53030" text-anchor="middle">下水池A</text>

  <rect x="325" y="275" width="120" height="50" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="385" y="305" font-size="10" fill="#c53030" text-anchor="middle">下水池B</text>

  <rect x="495" y="275" width="120" height="50" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="555" y="305" font-size="10" fill="#c53030" text-anchor="middle">下水池C</text>

  <!-- 合流 -->
  <line x1="210" y1="325" x2="385" y2="365" stroke="#e53e3e" stroke-width="1.5"/>
  <line x1="385" y1="325" x2="385" y2="365" stroke="#e53e3e" stroke-width="1.5"/>
  <line x1="555" y1="325" x2="385" y2="365" stroke="#e53e3e" stroke-width="1.5"/>

  <!-- 浄化② -->
  <rect x="340" y="360" width="90" height="40" rx="20" fill="#f0e6ff" stroke="#805ad5" stroke-width="2"/>
  <text x="385" y="385" font-size="11" fill="#805ad5" text-anchor="middle" font-weight="bold">浄化 ②</text>

  <!-- 川下へ -->
  <line x1="340" y1="380" x2="76" y2="380" stroke="#38a169" stroke-width="2.5"/>
  <polygon points="81,376 73,380 81,384" fill="#38a169"/>
  <text x="180" y="372" font-size="10" fill="#38a169">浄化して川に返す</text>

  <!-- 汚泥 -->
  <line x1="430" y1="380" x2="490" y2="380" stroke="#d69e2e" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="486,376 494,380 486,384" fill="#d69e2e"/>
  <text x="540" y="384" font-size="10" fill="#d69e2e">汚泥 → 城外の農地へ</text>

  <!-- 管理体制 -->
  <g transform="translate(680, 50)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
    <text x="80" y="22" font-size="11" fill="#276749" text-anchor="middle" font-weight="bold">管理体制</text>
    <text x="10" y="42" font-size="10" fill="#2d3748">水公爵家が統括</text>
    <text x="10" y="58" font-size="10" fill="#2d3748">区画ごとに水魔法使い配置</text>
    <text x="10" y="74" font-size="10" fill="#2d3748">暗渠の維持は土魔法使い</text>
    <text x="10" y="90" font-size="10" fill="#2d3748">浄化は毎日の定例作業</text>
    <text x="10" y="110" font-size="10" fill="#718096">（複数人で運用）</text>
  </g>
</svg>
</div>

<div class="note-box">
  <strong>設計思想：「川から借りた水は、きれいにして川に返す」</strong><br>
  工業廃水のような深刻な汚染はこの世界には存在しないが、自然と共に生きる人々にとって、汚水をそのまま川に戻すことは「借りたものを汚して返す」ことと同じ感覚である。水守が浄化してから川に返すのは、技術的な必要性だけでなく、文化的な当然の作法として根付いている。
</div>

</body>
</html>
