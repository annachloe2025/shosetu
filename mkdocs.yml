# ======================================================================
# MkDocs 設定ファイル
# ----------------------------------------------------------------------
# このファイルは `設定資料/` フォルダを対象に、ウェブで読めるサイトを
# 自動生成するための設定です。
# ローカル確認 : mkdocs serve     → http://127.0.0.1:8000
# 本番ビルド   : mkdocs build     → site/ フォルダに成果物
# GitHub公開   : mkdocs gh-deploy → GitHub Pages に直接公開
# ======================================================================

site_name: 小説設定資料
site_description: ファンタジー小説の世界設定・キャラクター設定のウィキ
site_author: hoehoe

# `設定資料/` フォルダを中身として使う（今ある .md をそのまま素材にする）
docs_dir: 設定資料

# ビルド成果物は site/ フォルダへ
site_dir: site

# -----------------------------------------------------------------
# テーマ設定（Material for MkDocs）
# -----------------------------------------------------------------
theme:
  name: material
  language: ja
  features:
    - navigation.instant          # ページ遷移を高速化
    - navigation.tracking         # URLにアンカーを追従
    - navigation.tabs             # 最上位カテゴリをタブで表示
    - navigation.sections         # サイドバーでセクション展開
    - navigation.top              # トップに戻るボタン
    - toc.follow                  # 目次スクロール追従
    - search.suggest              # 検索サジェスト
    - search.highlight            # 検索結果をハイライト
    - content.code.copy           # コードブロックにコピーボタン
  palette:
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# -----------------------------------------------------------------
# プラグイン
# -----------------------------------------------------------------
plugins:
  - search:
      lang:
        - ja
        - en

# -----------------------------------------------------------------
# Markdown 拡張機能
# -----------------------------------------------------------------
markdown_extensions:
  - admonition                    # !!! note 形式の注釈ブロック
  - attr_list                     # 画像やリンクに属性を追加
  - def_list                      # 定義リスト
  - footnotes                     # 脚注
  - md_in_html                    # HTML内にMarkdown
  - tables                        # 表
  - toc:
      permalink: true             # 見出しに # リンクを付与
      toc_depth: 3
  - pymdownx.details              # 折りたたみブロック
  - pymdownx.superfences          # コードブロック拡張
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# -----------------------------------------------------------------
# ナビゲーション
# -----------------------------------------------------------------
# 明示的な nav を書かない場合、MkDocs はフォルダ構造から自動生成する。
# いまは自動生成に任せ、必要があとで出てきたらここで順番をカスタマイズする。
# -----------------------------------------------------------------

# ドキュメント内で有効な設定
strict: false                     # 警告でビルドを止めない（初期は寛容に）
use_directory_urls: true          # URL を /page/ 形式に（キレイ）
