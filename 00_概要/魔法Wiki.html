<title>魔法Wiki — ファンタジー小説世界設定</title>
<style>

    --bg: #0a0b1a;
    --bg2: #12132a;
    --surface: #1a1c38;
    --surface2: #23254a;
    --text: #e6e8f5;
    --muted: #8d92b5;
    --border: #2e3256;
    --accent: #a78bfa;
    --accent2: #7eb6ff;
    --earth: #6ee7a5;
    --water: #7eb6ff;
    --fire: #ff8486;
    --wind: #ffd84a;
    --reso: #f5f7ff;
    --cat-principle: #a78bfa;
    --cat-heredity: #f472b6;
    --cat-measure: #fbbf24;
    --cat-device: #60a5fa;
    --cat-special: #f5f7ff;
    --cat-inorg: #6ee7a5;
    --cat-org: #b08968;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "游ゴシック", "Yu Gothic", "Hiragino Sans", "メイリオ", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* Topbar */
  .topbar {
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar .logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: linear-gradient(90deg, #a78bfa, #7eb6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topbar .sep { color: var(--muted); font-size: 12px; }
  .topbar .subtitle { color: var(--muted); font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .topbar input[type="search"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    width: 260px;
    font-family: inherit;
  }
  .topbar input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .topbar button.home-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .topbar button.home-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  aside.sidebar {
    width: 280px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 0;
    flex-shrink: 0;
  }
  aside.sidebar h3 {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    padding: 14px 20px 6px;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  aside.sidebar h3:first-child { border-top: none; margin-top: 0; }
  aside.sidebar ul { list-style: none; }
  aside.sidebar li a {
    display: block;
    padding: 7px 20px 7px 30px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  aside.sidebar li a:hover {
    background: var(--surface);
    border-left-color: var(--accent);
  }
  aside.sidebar li a.active {
    background: var(--surface2);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  aside.sidebar li a.hidden { display: none; }
  /* Main */
  main.content {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
  }
  main.content .page { display: none; max-width: 900px; margin: 0 auto; }
  main.content .page.active { display: block; }
  .crumb {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .crumb .cat {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-right: 8px;
    color: var(--accent);
  }
  main.content h1 {
    font-size: 32px;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  main.content h2 {
    font-size: 17px;
    margin-top: 32px;
    margin-bottom: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  main.content h2::before {
    content: "● ";
    color: var(--accent2);
  }
  .summary {
    font-size: 17px;
    color: var(--text);
    padding: 16px 20px;
    background: var(--surface);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
    margin: 20px 0 10px;
  }
  .list { list-style: none; }
  .list li {
    padding: 8px 0 8px 24px;
    position: relative;
    font-size: 15px;
    border-bottom: 1px dashed var(--border);
  }
  .list li::before {
    content: "▸";
    position: absolute;
    left: 4px;
    color: var(--accent);
  }
  .list li:last-child { border-bottom: none; }
  .numbers { list-style: none; }
  .numbers li {
    padding: 6px 0 6px 28px;
    position: relative;
    font-size: 13px;
    color: var(--text);
    font-family: "Menlo", "Consolas", monospace;
  }
  .numbers li::before {
    content: "◆";
    position: absolute;
    left: 8px;
    color: var(--wind);
    font-size: 10px;
  }

  .related-chips a {
    display: inline-block;
    padding: 5px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    transition: all 0.15s;

  .related-chips a:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--surface2);
  }
  .source-link {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .source-link a { color: var(--accent); text-decoration: none; }
  .source-link a:hover { text-decoration: underline; }

  .hero {
    text-align: center;
    padding: 40px 0 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;

  .hero .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    border: none;
    background: linear-gradient(90deg, #a78bfa, #7eb6ff, #6ee7a5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

  .hero p {
    color: var(--muted);
    max-width: 600px;
    margin: 0 auto;
    font-size: 14px;
  }
  /* Pillars */
  .pillars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .pillar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    padding: 16px;
    border-radius: 8px;
  }
  .pillar h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .pillar p { font-size: 12px; color: var(--muted); line-height: 1.6; }
  /* Category grid */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin: 30px 0;
  }
  .cat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    padding: 18px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;

  .cat-card h3 {
    font-size: 16px;
    margin-bottom: 8px;
    margin-top: 0;
    color: inherit;

  .cat-card p { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .cat-card ul {
    list-style: none;
    font-size: 12px;
  }
  .cat-card ul li {
    padding: 2px 0;
    color: var(--text);
    border: none;
  }
  .cat-card ul li::before { content: ""; }
  .cat-card.principle { border-left-color: var(--cat-principle); }
  .cat-card.principle h3 { color: var(--cat-principle); }
  .cat-card.heredity { border-left-color: var(--cat-heredity); }
  .cat-card.heredity h3 { color: var(--cat-heredity); }
  .cat-card.measure { border-left-color: var(--cat-measure); }
  .cat-card.measure h3 { color: var(--cat-measure); }
  .cat-card.device { border-left-color: var(--cat-device); }
  .cat-card.device h3 { color: var(--cat-device); }
  .cat-card.special { border-left-color: var(--cat-special); }
  .cat-card.special h3 { color: var(--cat-special); }
  .cat-card.inorg { border-left-color: var(--cat-inorg); }
  .cat-card.inorg h3 { color: var(--cat-inorg); }
  .cat-card.org { border-left-color: var(--cat-org); }
  .cat-card.org h3 { color: var(--cat-org); }
  /* No-result message */
  .noresult {
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 14px;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  /* Responsive */
  @media (max-width: 768px) {
    aside.sidebar { width: 220px; }
    main.content { padding: 20px; }
    .hero h1 { font-size: 28px; }
    .topbar input[type="search"] { width: 140px; }
  }
</style>

function renderPage(id, page) {
  const relatedHtml = page.related.map(rid => {
    const rp = PAGES[rid];
    if (!rp) return `<span style="color:var(--muted);font-size:12px;">${rid}（外部）</span>`;
    return `<a href="#${rid}" onclick="nav('${rid}');return false;">${rp.title}</a>`;
  }).join('');

  return `
    <article class="page" data-page="${id}" data-category="${page.category}" data-search="${(page.title + ' ' + page.summary + ' ' + page.highlights.join(' ') + ' ' + page.numbers.join(' ')).toLowerCase()}">
      <div class="crumb"><span class="cat">${page.category}</span> ${page.title}</div>
      <h1>${page.title}</h1>
      <div class="summary">${page.summary}</div>
      <h2>要点</h2>
      <ul class="list">
        ${page.highlights.map(h => `<li>${h}</li>`).join('')}
      </ul>
      <h2>主要数値・コスト</h2>
      <ul class="numbers">
        ${page.numbers.map(n => `<li>${n}</li>`).join('')}
      </ul>
      <h2>関連項目</h2>
      <div class="related-chips">${relatedHtml}</div>
      <div class="source-link">
        元ファイル: <a href="../${page.path}" target="_blank">${page.path}</a>
      </div>
    </article>
  `;
}

// ============================================================
// Navigation
// ============================================================
function nav(id) {
  document.querySelectorAll('main .page').forEach(p => p.classList.remove('active'));
  const target = document.querySelector(`main .page[data-page="${id}"]`);
  if (target) {
    target.classList.add('active');
    document.getElementById('content').scrollTop = 0;
  }
  document.querySelectorAll('aside a').forEach(a => a.classList.remove('active'));
  const navlink = document.querySelector(`aside a[data-page="${id}"]`);
  if (navlink) navlink.classList.add('active');
  if (history.pushState) {
    history.pushState(null, '', '#' + id);
  }
}

function handleHash() {
  const hash = location.hash.replace('#', '') || 'home';
  if (hash === 'home' || PAGES[hash]) {
    nav(hash);
  }
}

// ============================================================
// Search
// ============================================================
function doSearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const links = document.querySelectorAll('aside li a[data-page]');
  if (!q) {
    links.forEach(a => a.classList.remove('hidden'));
    return;
  }
  links.forEach(a => {
    const id = a.dataset.page;
    const page = PAGES[id];
    if (!page) return;
    const hay = (page.title + ' ' + page.summary + ' ' + page.highlights.join(' ') + ' ' + page.numbers.join(' ') + ' ' + page.category).toLowerCase();
    if (hay.includes(q)) {
      a.classList.remove('hidden');
    } else {
      a.classList.add('hidden');
    }
  });
}

// ============================================================

window.addEventListener('hashchange', handleHash);
document.getElementById('search').addEventListener('input', doSearch);
